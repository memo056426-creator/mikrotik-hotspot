<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>تسجيل الدخول إلى الشبكة</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  $(if chap-id)
  <form name="sendin" action="$(link-login-only)" method="post" class="hidden">
    <input type="hidden" name="username">
    <input type="hidden" name="password">
    <input type="hidden" name="dst" value="$(link-orig)">
    <input type="hidden" name="popup" value="true">
  </form>
  <script src="/md5.js"></script>
  $(endif)

  <main class="page-shell">
    <section class="card">
      <div class="brand-mark" aria-hidden="true">Wi‑Fi</div>
      <h1>مرحبًا بك</h1>
      <p class="subtitle">أدخل رمز الاشتراك للاتصال بالإنترنت</p>

      $(if error)
      <div class="alert" role="alert">$(error)</div>
      $(endif)

      <form name="login" action="$(link-login-only)" method="post" onsubmit="return doLogin()">
        <input type="hidden" name="username" id="loginUsername">
        <input type="hidden" name="password" id="loginPassword">
        <input type="hidden" name="dst" value="$(link-orig)">
        <input type="hidden" name="popup" value="true">

        <label for="accessCode">رمز الدخول</label>
        <input
          id="accessCode"
          type="text"
          value="$(username)"
          autocomplete="off"
          inputmode="text"
          placeholder="أدخل رمز الدخول"
          required
          autofocus
        >

        <button class="primary-button" type="submit">دخول</button>
      </form>

      <p class="fine-print">باستخدامك للشبكة فأنت توافق على سياسة الاستخدام الخاصة بمزوّد الخدمة.</p>
    </section>
  </main>

  <script>
    function doLogin() {
      var code = document.getElementById("accessCode").value.trim();
      if (!code) return false;

      $(if chap-id)
      document.sendin.username.value = code;
      document.sendin.password.value =
        hexMD5('$(chap-id)' + code + '$(chap-challenge)');
      document.sendin.submit();
      return false;
      $(else)
      document.getElementById("loginUsername").value = code;
      document.getElementById("loginPassword").value = code;
      return true;
      $(endif)
    }
  </script>
</body>
</html>
