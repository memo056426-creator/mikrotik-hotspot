<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111c">
  <title>شبكة مكتب عماد عدن العقاري</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  $(if chap-id)
  <form name="sendin" action="$(link-login-only)" method="post" class="hidden">
    <input type="hidden" name="username">
    <input type="hidden" name="password">
    <input type="hidden" name="dst" value="$(link-orig)">
    <input type="hidden" name="popup" value="true">
  </form>
  <script src="/md5.js"></script>
  $(endif)

  <main class="portal-shell">
    <section class="glass-panel">
      <div class="brand-emblem" aria-hidden="true">
        <div class="crest">⌂</div>
      </div>

      <h1>شبكة مكتب عماد عدن العقاري</h1>
      <p class="subtitle">بوابة نقطة الاتصال • جلسة ضيف آمنة</p>

      $(if error)
      <div class="alert" role="alert">$(error)</div>
      $(endif)

      <form name="login" action="$(link-login-only)" method="post" onsubmit="return doLogin()">
        <input type="hidden" name="username" id="loginUsername">
        <input type="hidden" name="password" id="loginPassword">
        <input type="hidden" name="dst" value="$(link-orig)">
        <input type="hidden" name="popup" value="true">

        <div class="code-field">
          <span class="key-icon" aria-hidden="true">⚿</span>
          <input
            id="accessCode"
            type="text"
            value="$(username)"
            autocomplete="off"
            inputmode="text"
            placeholder="رمز الكرت"
            required
            autofocus
          >
        </div>

        <button class="primary-button" type="submit">تسجيل الدخول</button>
      </form>

      <div class="security-row" aria-hidden="true">
        <span>♢</span>
        <span>🔒</span>
        <span>متصل • شبكة 5G • مؤمّن بتقنية WPA3</span>
      </div>

      <p class="fine-print">بالضغط على تسجيل الدخول فأنت توافق على الشروط والأحكام</p>
    </section>
  </main>

  <script>
    function doLogin() {
      var code = document.getElementById("accessCode").value.trim();
      if (!code) return false;

      $(if chap-id)
      document.sendin.username.value = code;
      document.sendin.password.value =
        hexMD5('$(chap-id)' + code + '$(chap-challenge)');
      document.sendin.submit();
      return false;
      $(else)
      document.getElementById("loginUsername").value = code;
      document.getElementById("loginPassword").value = code;
      return true;
      $(endif)
    }
  </script>
</body>
</html>
