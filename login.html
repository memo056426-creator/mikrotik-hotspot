<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05070a">
  <title>شبكة مكتب عماد عدن العقاري</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  $(if chap-id)
  <form name="sendin" action="$(link-login-only)" method="post" class="hidden">
    <input type="hidden" name="username">
    <input type="hidden" name="password">
    <input type="hidden" name="dst" value="$(link-status)">
    <input type="hidden" name="popup" value="true">
  </form>
  <script src="/md5.js"></script>
  $(endif)

  <main class="stage">
    <section class="reference-ui" aria-label="بوابة شبكة مكتب عماد عدن العقاري">
      $(if error)
      <div class="mikrotik-error" id="mikrotikError" data-error="$(error)">$(error)</div>
      <button class="support-help" id="supportHelp" type="button" onclick="toggleHelp()">مساعدة</button>
      <div class="support-panel" id="supportPanel" hidden>
        تأكد من كتابة رمز الكرت كما هو. إذا كان الرمز صحيحًا واستمرت المشكلة، فقد يكون الكرت منتهيًا أو مستخدمًا على جهاز آخر. عند استمرار المشكلة راجع مكتب عماد عدن العقاري.
      </div>
      $(endif)

      <div class="portal-countdown" aria-live="polite">
        <span class="countdown-label">المتبقي من 27 يوم</span>
        <strong id="cardCountdown">27 يوم 00:00:00</strong>
      </div>

      <form class="hotspot-form" name="login" action="$(link-login-only)" method="post" onsubmit="return doLogin()">
        <input type="hidden" name="username" id="loginUsername">
        <input type="hidden" name="password" id="loginPassword">
        <input type="hidden" name="dst" value="$(link-status)">
        <input type="hidden" name="popup" value="true">

        <label class="sr-only" for="accessCode">رمز الكرت</label>
        <input
          class="access-code"
          id="accessCode"
          type="text"
          value="$(username)"
          autocomplete="off"
          inputmode="text"
          aria-label="رمز الكرت"
          required
        >

        <button class="login-hitbox" type="submit" aria-label="تسجيل الدخول">
          <span class="sr-only">تسجيل الدخول</span>
        </button>
      </form>
    </section>
  </main>

  <script>
    (function translateHotspotError() {
      var box = document.getElementById("mikrotikError");
      if (!box) return;
      var raw = (box.getAttribute("data-error") || box.textContent || "").toLowerCase();
      var message = "تعذر تسجيل الدخول. تحقق من رمز الكرت وحاول مرة أخرى.";

      if (raw.indexOf("invalid username or password") !== -1 ||
          raw.indexOf("invalid username") !== -1 ||
          raw.indexOf("invalid password") !== -1) {
        message = "رمز الكرت غير صحيح.";
      } else if (raw.indexOf("uptime limit") !== -1 ||
                 raw.indexOf("reached uptime") !== -1 ||
                 raw.indexOf("limit reached") !== -1) {
        message = "انتهت صلاحية هذا الكرت.";
      } else if (raw.indexOf("no more sessions") !== -1 ||
                 raw.indexOf("already logged in") !== -1 ||
                 raw.indexOf("simultaneous") !== -1) {
        message = "انتظر دقيقة واحدة ثم حاول تسجيل الدخول مرة أخرى.";
      }

      box.textContent = message;
    })();

    function toggleHelp() {
      var panel = document.getElementById("supportPanel");
      if (!panel) return;
      panel.hidden = !panel.hidden;
    }

    function doLogin() {
      var code = document.getElementById("accessCode").value.trim();
      if (!code) return false;

      $(if chap-id)
      document.sendin.username.value = code;
      document.sendin.password.value =
        hexMD5('$(chap-id)' + code + '$(chap-challenge)');
      document.sendin.submit();
      return false;
      $(else)
      document.getElementById("loginUsername").value = code;
      document.getElementById("loginPassword").value = code;
      return true;
      $(endif)
    }
  </script>

  <script>
    (function () {
      var TOTAL = 27 * 24 * 60 * 60 * 1000;
      var KEY = "emad_hotspot_27d_start";
      var started = null;
      try {
        started = Number(localStorage.getItem(KEY));
        if (!started || started > Date.now()) {
          started = Date.now();
          localStorage.setItem(KEY, String(started));
        }
      } catch (e) {
        started = Date.now();
      }

      function updateCardCountdown() {
        var el = document.getElementById("cardCountdown");
        if (!el) return;
        var left = Math.max(0, TOTAL - (Date.now() - started));
        var totalSeconds = Math.floor(left / 1000);
        var days = Math.floor(totalSeconds / 86400);
        var hours = Math.floor((totalSeconds % 86400) / 3600);
        var minutes = Math.floor((totalSeconds % 3600) / 60);
        var seconds = totalSeconds % 60;
        var pad = function (n) { return String(n).padStart(2, "0"); };
        el.textContent = days + " يوم " + pad(hours) + ":" + pad(minutes) + ":" + pad(seconds);
      }

      updateCardCountdown();
      setInterval(updateCardCountdown, 1000);
    })();
  </script>

</body>
</html>
