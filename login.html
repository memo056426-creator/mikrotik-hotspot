<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>تسجيل الدخول إلى الشبكة</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  $(if chap-id)
  <form name="sendin" action="$(link-login-only)" method="post" class="hidden">
    <input type="hidden" name="username">
    <input type="hidden" name="password">
    <input type="hidden" name="dst" value="$(link-orig)">
    <input type="hidden" name="popup" value="true">
  </form>
  <script src="/md5.js"></script>
  <script>
    function doLogin() {
      document.sendin.username.value = document.login.username.value;
      document.sendin.password.value = hexMD5('$(chap-id)' + document.login.password.value + '$(chap-challenge)');
      document.sendin.submit();
      return false;
    }
  </script>
  $(endif)

  <main class="page-shell">
    <section class="card">
      <div class="brand-mark" aria-hidden="true">Wi‑Fi</div>
      <h1>مرحبًا بك</h1>
      <p class="subtitle">أدخل بيانات الاشتراك للاتصال بالإنترنت</p>

      $(if error)
      <div class="alert" role="alert">$(error)</div>
      $(endif)

      <form name="login" action="$(link-login-only)" method="post" $(if chap-id) onsubmit="return doLogin()" $(endif)>
        <input type="hidden" name="dst" value="$(link-orig)">
        <input type="hidden" name="popup" value="true">

        <label for="username">اسم المستخدم</label>
        <input id="username" name="username" type="text" value="$(username)" autocomplete="username" required autofocus>

        <label for="password">كلمة المرور</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button class="ghost-button" type="button" id="togglePassword" aria-label="إظهار كلمة المرور">إظهار</button>
        </div>

        <button class="primary-button" type="submit">دخول</button>
      </form>

      <p class="fine-print">باستخدامك للشبكة فأنت توافق على سياسة الاستخدام الخاصة بمزوّد الخدمة.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
