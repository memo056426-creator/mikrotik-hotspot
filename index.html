<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05070a">
  <title>شبكة مكتب عماد عدن العقاري</title>
  <link rel="stylesheet" href="style.css?v=20261006-3">
</head>
<body>
  <main class="stage">
    <section class="reference-ui" aria-label="معاينة بوابة شبكة مكتب عماد عدن العقاري">
      <div class="portal-countdown" aria-live="polite" style="position:absolute!important;left:4%!important;top:18%!important;transform:none!important;width:30%!important;min-width:0!important;max-width:none!important;padding:7px 9px 8px!important;border-radius:14px!important;border:1px solid rgba(255,72,88,.95)!important;background:linear-gradient(135deg,rgba(140,8,24,.94),rgba(48,5,12,.88))!important;box-shadow:0 0 18px rgba(255,35,58,.38)!important;z-index:9!important;">
        <span class="countdown-label">المتبقي من 27 يوم</span>
        <strong id="cardCountdown">27 يوم 00:00:00</strong>
      </div>

      <form class="hotspot-form" onsubmit="event.preventDefault()">
        <label class="sr-only" for="accessCode">رمز الكرت</label>
        <input class="access-code" id="accessCode" type="text" autocomplete="off" inputmode="text" aria-label="رمز الكرت">
        <button class="login-hitbox" type="submit" aria-label="تسجيل الدخول">
          <span class="sr-only">تسجيل الدخول</span>
        </button>
      </form>
    </section>
  </main>

  <script>
    (function () {
      var TOTAL = 27 * 24 * 60 * 60 * 1000;
      var KEY = "emad_hotspot_27d_start";
      var started = null;
      try {
        started = Number(localStorage.getItem(KEY));
        if (!started || started > Date.now()) {
          started = Date.now();
          localStorage.setItem(KEY, String(started));
        }
      } catch (e) {
        started = Date.now();
      }

      function updateCardCountdown() {
        var el = document.getElementById("cardCountdown");
        if (!el) return;
        var left = Math.max(0, TOTAL - (Date.now() - started));
        var totalSeconds = Math.floor(left / 1000);
        var days = Math.floor(totalSeconds / 86400);
        var hours = Math.floor((totalSeconds % 86400) / 3600);
        var minutes = Math.floor((totalSeconds % 3600) / 60);
        var seconds = totalSeconds % 60;
        var pad = function (n) { return String(n).padStart(2, "0"); };
        el.textContent = days + " يوم " + pad(hours) + ":" + pad(minutes) + ":" + pad(seconds);
      }

      updateCardCountdown();
      setInterval(updateCardCountdown, 1000);
    })();
  </script>

</body>
</html>
