<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>حالة الاتصال</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <section class="card">
      <div class="status-dot" aria-hidden="true"></div>
      <h1>متصل بالإنترنت</h1>
      <p class="subtitle">مرحبًا $(username)</p>

      <div class="stats">
        <div class="stat"><span>مدة الاتصال</span><strong>$(uptime)</strong></div>
        <div class="stat"><span>تم الاستقبال</span><strong>$(bytes-in-nice)</strong></div>
        <div class="stat"><span>تم الإرسال</span><strong>$(bytes-out-nice)</strong></div>
        $(if session-time-left)
        <div class="stat"><span>الوقت المتبقي</span><strong>$(session-time-left)</strong></div>
        $(endif)
      </div>

      <form action="$(link-logout)" name="logout" method="post">
        <input type="hidden" name="erase-cookie" value="on">
        <button class="secondary-button" type="submit">تسجيل الخروج</button>
      </form>
    </section>
  </main>
</body>
</html>
