<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05070a">
  <title>حالة الاتصال</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="status-stage">
    <section class="status-card">
      <div class="status-badge">✓</div>
      <h1 class="status-title">متصل بالإنترنت</h1>
      <p class="status-user">مرحبًا $(username)</p>

      $(if session-time-left)
      <div class="time-card">
        <span class="time-label">مدة الكرت المتبقية</span>
        <strong class="time-value">$(session-time-left)</strong>
      </div>
      $(else)
      <div class="time-card">
        <span class="time-label">مدة الكرت</span>
        <strong class="time-value">غير محددة</strong>
      </div>
      $(endif)

      <div class="status-stats">
        <div class="status-stat">
          <span>مدة الاتصال</span>
          <strong>$(uptime)</strong>
        </div>
        <div class="status-stat">
          <span>تم الاستقبال</span>
          <strong>$(bytes-in-nice)</strong>
        </div>
        <div class="status-stat">
          <span>تم الإرسال</span>
          <strong>$(bytes-out-nice)</strong>
        </div>
      </div>

      <form action="$(link-logout)" name="logout" method="post">
        <input type="hidden" name="erase-cookie" value="on">
        <button class="status-logout" type="submit">تسجيل الخروج</button>
      </form>
    </section>
  </main>
</body>
</html>
